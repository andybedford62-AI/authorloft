        - link "How to sell your book directly to readers — without Amazon taking a cut For independent authors 5 min How to sell your book directly to readers — without Amazon taking a cut Most indie authors treat Amazon as the default. You publish, you list, you wait. That is a reasonable starting point. Amazon has the traffic, the infrastructure, and the trust of millions of readers. It makes sense to be there. When a reader buys your book on Amazon, Amazon owns that relationship. You get the royalty. Amazon gets the customer's name, email address, and purchase history. The next time that reader wants to buy a book — yours or someone else's — Amazon is the starting point, not you. You start from zero every time. This is not a criticism of Amazon. It is simply how their business model works. The question is whether it should be the only model you work with. Read article" [ref=e112] [cursor=pointer]:
