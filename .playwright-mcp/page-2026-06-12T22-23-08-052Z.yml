        - heading "GDPR & Your Data Rights" [level=1] [ref=e12]
        - paragraph [ref=e13]: "Last updated: May 19, 2026"
        - paragraph [ref=e14]: AuthorLoft is committed to protecting the personal data of everyone who uses our platform. This page explains how we comply with the General Data Protection Regulation (GDPR) and the UK GDPR, and how you can exercise your rights as a data subject.
      - generic [ref=e15]:
        - generic [ref=e16]:
          - heading "Who We Are (Data Controller)" [level=2] [ref=e17]
          - generic [ref=e18]:
            - paragraph [ref=e19]: AuthorLoft is the Data Controller for personal data collected through this platform. We are responsible for deciding how and why your data is processed.
            - paragraph [ref=e20]: "If you have questions about your data or wish to exercise your rights, you can contact us at:"
            - paragraph [ref=e21]:
              - strong [ref=e22]: "Email:"
              - text: hello@authorloft.com
              - strong [ref=e23]: "Website:"
              - text: https://www.authorloft.com/contact
        - generic [ref=e24]:
          - heading "What Data We Collect and Why" [level=2] [ref=e25]
          - generic [ref=e26]:
            - paragraph [ref=e27]: "We collect only the data necessary to provide the AuthorLoft service:"
            - paragraph [ref=e28]:
              - strong [ref=e29]: Account data
              - text: — name, email address, password (hashed). Used to create and manage your account.
            - paragraph [ref=e30]:
              - strong [ref=e31]: Author profile data
              - text: — biography, profile photo, website links. Used to build your public author page.
            - paragraph [ref=e32]:
              - strong [ref=e33]: Book catalog data
              - text: — book titles, descriptions, cover images, pricing. Used to display your catalog to readers.
            - paragraph [ref=e34]:
              - strong [ref=e35]: Newsletter subscriber data
              - text: — reader email addresses collected through your author site. Stored on your behalf; you own this data.
            - paragraph [ref=e36]:
              - strong [ref=e37]: Payment data
              - text: — processed entirely by Stripe. AuthorLoft never stores card numbers or bank details. Stripe is an independent Data Controller for payment information.
            - paragraph [ref=e38]:
              - strong [ref=e39]: Usage data
              - text: — pages visited, features used, error logs. Used to improve the service and diagnose issues.
            - paragraph [ref=e40]:
              - strong [ref=e41]: Communications
              - text: — emails you send to our support team. Used to respond to your enquiry.
        - generic [ref=e42]:
          - heading "Legal Basis for Processing" [level=2] [ref=e43]
          - generic [ref=e44]:
            - paragraph [ref=e45]: "We rely on the following legal bases under GDPR Article 6:"
            - paragraph [ref=e46]:
              - strong [ref=e47]: Contract performance (Art. 6(1)(b))
              - text: — processing your account, author profile, and book data is necessary to deliver the AuthorLoft service you signed up for.
            - paragraph [ref=e48]:
              - strong [ref=e49]: Legitimate interests (Art. 6(1)(f))
              - text: — usage analytics and security monitoring to maintain a safe, functioning platform.
            - paragraph [ref=e50]:
              - strong [ref=e51]: Consent (Art. 6(1)(a))
              - text: — marketing emails (you can opt out at any time). Cookie consent where applicable.
            - paragraph [ref=e52]:
              - strong [ref=e53]: Legal obligation (Art. 6(1)(c))
              - text: — retaining transaction records as required by applicable tax and financial regulations.
        - generic [ref=e54]:
          - heading "Your Rights Under GDPR" [level=2] [ref=e55]
          - generic [ref=e56]:
            - paragraph [ref=e57]: "If you are located in the European Economic Area (EEA) or the United Kingdom, you have the following rights:"
            - paragraph [ref=e58]:
              - strong [ref=e59]: Right of access
              - text: — you can request a copy of the personal data we hold about you.
            - paragraph [ref=e60]:
              - strong [ref=e61]: Right to rectification
              - text: — you can ask us to correct inaccurate or incomplete data.
            - paragraph [ref=e62]:
              - strong [ref=e63]: Right to erasure ("right to be forgotten")
              - text: — you can ask us to delete your data. We will comply unless we are required to retain it by law (e.g. financial records).
            - paragraph [ref=e64]:
              - strong [ref=e65]: Right to data portability
              - text: — you can request your data in a structured, machine-readable format (CSV or JSON).
            - paragraph [ref=e66]:
              - strong [ref=e67]: Right to restriction
              - text: — you can ask us to pause processing your data while a dispute is resolved.
            - paragraph [ref=e68]:
              - strong [ref=e69]: Right to object
              - text: — you can object to processing based on legitimate interests. We will stop unless we can demonstrate compelling grounds.
            - paragraph [ref=e70]:
              - strong [ref=e71]: Right to withdraw consent
              - text: — where processing is based on consent (e.g. marketing emails), you can withdraw it at any time without affecting the lawfulness of prior processing.
            - paragraph [ref=e72]:
              - text: To exercise any of these rights, email us at
              - strong [ref=e73]: hello@authorloft.com
              - text: with the subject line "Data Rights Request". We will respond within 30 days.
        - generic [ref=e74]:
          - heading "Third-Party Data Processors" [level=2] [ref=e75]
          - generic [ref=e76]:
            - paragraph [ref=e77]: "We use the following sub-processors to deliver the AuthorLoft service. Each operates under a Data Processing Agreement (DPA):"
            - paragraph [ref=e78]:
              - strong [ref=e79]: Supabase
              - text: — database and authentication hosting. Data stored in data centres with SOC 2 Type II certification. https://supabase.com/privacy
            - paragraph [ref=e80]:
              - strong [ref=e81]: Stripe
              - text: — payment processing. PCI DSS Level 1 certified. Acts as an independent Data Controller for card data. https://stripe.com/privacy
            - paragraph [ref=e82]:
              - strong [ref=e83]: Vercel
              - text: — application hosting and content delivery. https://vercel.com/legal/privacy-policy
            - paragraph [ref=e84]:
              - strong [ref=e85]: Resend
              - text: — transactional email delivery (account emails, notifications). https://resend.com/privacy
            - paragraph [ref=e86]: We do not sell your data to any third party. We do not use your data for advertising purposes.
        - generic [ref=e87]:
          - heading "International Data Transfers" [level=2] [ref=e88]
          - paragraph [ref=e90]: AuthorLoft and its sub-processors may process data outside the EEA. Where this occurs, we ensure adequate safeguards are in place — such as Standard Contractual Clauses (SCCs) approved by the European Commission — to protect your rights under GDPR.
        - generic [ref=e91]:
          - heading "Data Retention" [level=2] [ref=e92]
          - generic [ref=e93]:
            - paragraph [ref=e94]: "We retain your data for as long as your account is active. If you close your account:"
            - paragraph [ref=e95]: "- Account and profile data is deleted within 30 days. - Book catalog and subscriber data is deleted within 30 days. - Transaction and billing records are retained for 7 years to comply with financial regulations. - Support correspondence is retained for 2 years."
            - paragraph [ref=e96]: You may request earlier deletion by contacting hello@authorloft.com.
        - generic [ref=e97]:
          - heading "Cookies" [level=2] [ref=e98]
          - generic [ref=e99]:
            - paragraph [ref=e100]: AuthorLoft uses essential cookies to keep you signed in and maintain your session. We do not use tracking or advertising cookies without your consent. A consent banner is shown on your first visit where required.
            - paragraph [ref=e101]: For full details see our Privacy Policy at https://www.authorloft.com/privacy.
        - generic [ref=e102]:
          - heading "How to Make a Complaint" [level=2] [ref=e103]
          - generic [ref=e104]:
            - paragraph [ref=e105]: "If you believe we have not handled your data correctly, you have the right to lodge a complaint with your local supervisory authority:"
