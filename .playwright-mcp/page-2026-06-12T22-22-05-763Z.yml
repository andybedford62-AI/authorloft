      - 'heading "Pre-Orders 101: Build Buzz Before Launch Day" [level=1] [ref=e23]'
      - paragraph [ref=e24]: The best time to start selling your next book is before it's finished. Here's how a "Coming Soon" page with pre-orders and a "Notify Me" signup builds momentum -- automatically -- for your launch.
      - 'img "Pre-Orders 101: Build Buzz Before Launch Day" [ref=e26]'
      - generic [ref=e27]:
        - generic [ref=e28]: A
        - generic [ref=e29]:
          - text: by
          - strong [ref=e30]: AuthorLoft Team
      - generic [ref=e31]:
        - paragraph [ref=e32]: "By the time most authors start marketing a book, the book already exists -- it's written, edited, formatted, and ready to go. But the most effective book marketing often starts before that point, while the book is still being finished. The tool that makes this possible is a simple one: a \"Coming Soon\" page with pre-orders."
        - heading "Why Launch Day Shouldn't Be the First Time Readers Hear About Your Book" [level=2] [ref=e33]
        - paragraph [ref=e34]: If the only time your readers learn about a new release is the day it goes live, you're starting from zero on the day that matters most. Every sale, every review, and every bit of momentum has to be generated from scratch, in real time, while you're also dealing with everything else launch day involves.
        - paragraph [ref=e35]: A pre-order period flips this. By the time your book is actually available, you already have a list of readers who've been waiting for it -- and who hear about the launch the moment it happens, because they asked to.
        - heading "What a Pre-Order / \"Coming Soon\" Page Actually Does" [level=2] [ref=e36]
        - paragraph [ref=e37]: "A Coming Soon page is a dedicated page for a book that hasn't been released yet. It includes:"
        - list [ref=e38]:
          - listitem [ref=e39]: The cover (even a placeholder or work-in-progress version)
          - listitem [ref=e40]: A description -- enough to generate interest, even if some details are still being finalized
          - listitem [ref=e41]: A launch date
          - listitem [ref=e42]: A "Notify Me" signup, so interested readers can ask to be told when it's available
        - paragraph [ref=e43]: "If you have direct sales enabled, this can go a step further: readers can actually pre-order and pay now, with the book delivered automatically the moment it's released."
        - 'heading "The \"Notify Me\" List: Your Launch Day Insurance" [level=2] [ref=e44]'
        - paragraph [ref=e45]: Even if you're not ready to take pre-orders for payment, the "Notify Me" signup alone is worth setting up months in advance. Every person who signs up is someone who has told you, directly, that they want to know the moment your book is available.
        - paragraph [ref=e46]: On launch day, AuthorLoft sends these signups a launch email automatically -- so instead of hoping your announcement reaches people at the right moment on social media, you have a list of people who specifically asked to hear from you, the moment there's something to say.
        - heading "Setting Up Your Coming Soon Page on AuthorLoft" [level=2] [ref=e47]
        - list [ref=e48]:
          - listitem [ref=e49]:
            - strong [ref=e50]: Create the book entry
            - text: in your dashboard as you normally would -- title, cover, description.
          - listitem [ref=e51]:
            - strong [ref=e52]: Set its status to "Coming Soon"
            - text: and add your target launch date.
          - listitem [ref=e53]:
            - strong [ref=e54]: Decide whether to enable pre-orders for payment
            - text: ", or just the \"Notify Me\" signup -- both are supported, and you can start with notify-only and add pre-orders later."
          - listitem [ref=e55]:
            - strong [ref=e56]: Publish the page.
            - text: It will appear on your books page and, like everything else you publish, in your site's sitemap -- so it's discoverable by search as soon as it's live.
          - listitem [ref=e57]:
            - strong [ref=e58]: Promote it
            - text: "-- link to it from your newsletter, social media, and your homepage."
        - heading "What to Include on Your Pre-Order Page" [level=2] [ref=e59]
        - list [ref=e60]:
          - listitem [ref=e61]:
            - strong [ref=e62]: A real (or close-to-final) cover.
            - text: Covers do a huge amount of the selling -- even a placeholder is better than a blank box, but a finished cover is far more effective.
          - listitem [ref=e63]:
            - strong [ref=e64]: A description that sells the premise
            - text: ", even if the back-cover copy isn't fully polished yet."
          - listitem [ref=e65]:
            - strong [ref=e66]: A specific date, if possible.
            - text: "\"Coming 2026\" creates less urgency than \"Available March 14, 2026.\""
          - listitem [ref=e67]:
            - strong [ref=e68]: A reason to act now
            - text: "-- if pre-orders are open, mention any pre-order bonus, such as a bonus short story or early access to the next ARC."
        - 'heading "Timing: When to Open Pre-Orders" [level=2] [ref=e69]'
        - paragraph [ref=e70]: There's a balance to strike. Too early, and momentum fizzles before launch; too late, and you miss the benefit entirely.
        - paragraph [ref=e71]:
          - text: A practical window is
          - strong [ref=e72]: four to eight weeks before release
          - text: "-- long enough to build a meaningful list and run a short promotional push, short enough that the excitement carries through to launch day. If you're also running an ARC program, opening pre-orders around the same time you send ARCs creates a natural moment to mention both: \"early readers are getting it now, and you can reserve your copy for [date].\""
        - heading "The Automatic Launch Email" [level=2] [ref=e73]
        - paragraph [ref=e74]: "The most valuable part of the \"Notify Me\" list is what happens on launch day itself: everyone who signed up receives an email automatically, letting them know the book is available. You don't have to remember to send it, segment the list, or write it under launch-day pressure -- it's part of the same setup you did weeks earlier."
        - paragraph [ref=e75]: This means your launch day announcement to your most interested readers is handled before launch day even arrives -- leaving you free to focus on the parts of launch day that do need your attention, like a broader newsletter send or social media posts.
        - heading "Using Pre-Orders Alongside Your ARC Program" [level=2] [ref=e76]
        - paragraph [ref=e77]: "Pre-orders and ARCs work well together because they target slightly different audiences with the same goal: momentum at launch."
        - paragraph [ref=e78]: Your ARC readers are a small, invited group getting an early copy in exchange for an honest review around launch day. Your pre-order / Notify Me list is a broader group of interested readers who'll hear about the book the moment it's live. Run both, and launch day arrives with reviews already posted and a list of people ready to buy immediately -- two of the strongest signals for visibility, both set up weeks in advance.
        - heading "The Bottom Line" [level=2] [ref=e79]
        - paragraph [ref=e80]: A Coming Soon page costs nothing to set up and starts working the moment it's published -- collecting interested readers while you finish writing, editing, or waiting on your cover. By the time your book is ready, so is its audience.
