      - generic [ref=e201]:
        - heading "The core difference" [level=2] [ref=e202]
        - paragraph [ref=e203]:
          - text: BookFunnel answers the question
          - emphasis [ref=e204]: "\"how do I get my book file to a reader?\""
          - text: "— reliably, across every device and e-reader. AuthorLoft answers a bigger one:"
          - emphasis [ref=e205]: "\"where do readers find me, follow me, and buy from me?\""
          - text: That means a branded website on your own domain, a storefront that sells ebooks, audiobooks and print directly, newsletter capture and campaigns, reviews, and a listing in the AuthorLoft discovery bookstore. The two aren't mutually exclusive — but if you only run one, AuthorLoft is the one that becomes your author home base.
      - generic [ref=e206]:
        - heading "Frequently asked questions" [level=2] [ref=e207]
        - generic [ref=e208]:
          - generic [ref=e209]:
            - heading "Is AuthorLoft a good BookFunnel alternative?" [level=3] [ref=e210]
            - paragraph [ref=e211]: Yes — if you want more than ebook delivery. BookFunnel excels at distributing files and reader magnets, but it isn't a website builder. AuthorLoft gives independent authors a full branded author website with a custom domain, plus direct sales of ebooks, audiobooks and print, newsletters, and a discovery bookstore — so readers can find you and buy from your own site.
          - generic [ref=e212]:
            - heading "Can I sell ebooks, audiobooks and print books directly with AuthorLoft?" [level=3] [ref=e213]
            - paragraph [ref=e214]: Yes. AuthorLoft supports direct sales of all three formats — ebook, audiobook and print — from your own author site, with payouts via Stripe. BookFunnel focuses on ebook delivery, with more limited audiobook and print options.
          - generic [ref=e215]:
            - heading "Does BookFunnel build an author website?" [level=3] [ref=e216]
            - paragraph [ref=e217]: No. BookFunnel is built around delivering ebooks and audiobooks to readers and running reader-magnet giveaways and newsletter swaps. It does not provide a full author website with custom pages, a custom domain, blog/news, or a storefront — which is the core of what AuthorLoft does.
          - generic [ref=e218]:
            - heading "Can I use AuthorLoft alongside BookFunnel?" [level=3] [ref=e219]
            - paragraph [ref=e220]: Many authors do. You can keep using BookFunnel for advance reader copies and giveaways while using AuthorLoft as your home base — your website, newsletter, storefront, and bookstore listing. AuthorLoft also has its own ARC and reader-magnet tools if you'd rather consolidate.
          - generic [ref=e221]:
            - heading "How much does AuthorLoft cost compared to BookFunnel?" [level=3] [ref=e222]
            - paragraph [ref=e223]: AuthorLoft has a free plan that includes a hosted author site and newsletter capture, with paid tiers that unlock a custom domain, direct sales, email campaigns and more. See the AuthorLoft pricing page for current plans; BookFunnel is sold as annual author plans priced by mailing-list size.
      - generic [ref=e224]:
        - paragraph [ref=e225]: · Start free ·
        - heading "Build your author home base on AuthorLoft" [level=2] [ref=e226]
        - paragraph [ref=e227]: A free hosted author site and newsletter capture to start — upgrade for a custom domain and direct sales when you're ready.
