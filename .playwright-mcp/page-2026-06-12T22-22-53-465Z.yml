        - heading "Privacy Policy" [level=1] [ref=e12]
        - paragraph [ref=e13]: "Last updated: March 31, 2026"
      - generic [ref=e14]:
        - paragraph [ref=e15]: AurthorLoft ("we", "our", or "us") is committed to protecting your personal information. This Privacy Policy explains how we collect, use, and safeguard data when you use ArthorLoft.com and any subdomains hosted on our platform.
        - heading "Information We Collect" [level=2] [ref=e16]
        - paragraph [ref=e17]: We collect information you provide directly to us, such as when you create an account, subscribe to an author's newsletter, or make a purchase. This may include your name, email address, payment information (processed securely by Stripe), and any other information you choose to provide.
        - paragraph [ref=e18]: We also collect certain information automatically when you visit our platform, including your IP address, browser type, operating system, referring URLs, and information about your use of our services through cookies and similar tracking technologies.
        - heading "How We Use Your Information" [level=2] [ref=e19]
        - paragraph [ref=e20]: "We use the information we collect to: - Provide, maintain, and improve our services - Process transactions and send related information, including purchase confirmations and invoices - Send you technical notices, updates, security alerts, and support messages - Respond to your comments and questions - Send marketing communications (you may opt out at any time) - Monitor and analyze trends, usage, and activities in connection with our services"
        - heading "Cookies" [level=2] [ref=e21]
        - paragraph [ref=e22]: We use cookies and similar tracking technologies to track activity on our platform and store certain information. You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, some portions of our service may not function properly.
        - heading "Data Sharing" [level=2] [ref=e23]
        - paragraph [ref=e24]:
          - text: "We do not sell your personal information. We may share your information with: -"
          - strong [ref=e25]: Stripe
          - text: ": for payment processing (governed by Stripe's Privacy Policy) -"
          - strong [ref=e26]: Service providers
          - text: ": who perform services on our behalf, bound by confidentiality agreements -"
          - strong [ref=e27]: Legal authorities
          - text: ": when required by law or to protect our rights"
        - heading "Data Retention" [level=2] [ref=e28]
        - paragraph [ref=e29]: We retain your personal information for as long as your account is active or as needed to provide you services. You may request deletion of your account and associated data by contacting us.
        - heading "Security" [level=2] [ref=e30]
        - paragraph [ref=e31]: We implement industry-standard security measures to protect your information. However, no method of transmission over the Internet or electronic storage is 100% secure.
        - heading "Your Rights" [level=2] [ref=e32]
        - paragraph [ref=e33]: Depending on your location, you may have the right to access, correct, or delete your personal information, object to or restrict processing, and data portability. To exercise these rights, please contact us.
        - heading "Children's Privacy" [level=2] [ref=e34]
        - paragraph [ref=e35]: Our services are not directed to individuals under 13. We do not knowingly collect personal information from children under 13.
        - heading "Changes to This Policy" [level=2] [ref=e36]
        - paragraph [ref=e37]: We may update this Privacy Policy from time to time. We will notify you of significant changes by posting a notice on our platform and updating the "Last Updated" date. Continued use of our services after changes constitutes acceptance of the updated policy.
        - heading "Contact Us" [level=2] [ref=e38]
        - paragraph [ref=e39]: If you have questions about this Privacy Policy, please contact us at the email address listed on our Contact page.
