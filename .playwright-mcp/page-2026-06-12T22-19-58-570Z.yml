      - generic [ref=e197]:
        - heading "Common questions" [level=3] [ref=e198]
        - generic [ref=e199]:
          - paragraph [ref=e200]: Can I switch plans later?
          - paragraph [ref=e201]: Yes — upgrade or downgrade at any time. Changes take effect immediately. If you upgrade mid-cycle you're charged a prorated amount.
        - generic [ref=e202]:
          - paragraph [ref=e203]: What happens if I exceed my book limit?
          - paragraph [ref=e204]: You can still view and edit existing books, but you won't be able to add new ones until you upgrade or remove a book.
        - generic [ref=e205]:
          - paragraph [ref=e206]: Do I need a payment processor for digital sales?
          - paragraph [ref=e207]: Yes — direct sales use Stripe. You connect your own Stripe account so payments go directly to you. AuthorLoft does not take a transaction cut.
        - generic [ref=e208]:
          - paragraph [ref=e209]: Can I use my own domain name?
          - paragraph [ref=e210]: Custom domains are available on Standard and Premium plans. You point your domain's DNS to AuthorLoft and we handle the rest.
        - generic [ref=e211]:
          - paragraph [ref=e212]: Is there a contract or lock-in?
          - paragraph [ref=e213]: No contract, no lock-in. Monthly plans can be cancelled anytime. Annual plans are billed yearly and include a 30-day money-back window.
