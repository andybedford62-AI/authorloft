        - heading "Digital Sales and Reader Transactions" [level=2] [ref=e29]
        - paragraph [ref=e30]: Authors who sell digital goods through ArthorLoft are solely responsible for fulfilling those sales, providing accurate product descriptions, and complying with applicable consumer protection laws. ArthorLoft acts as a platform intermediary only.
